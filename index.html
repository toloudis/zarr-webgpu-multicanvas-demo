<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zarr WebGPU Multi-Canvas Grid</title>
  </head>
  <body>
    <main class="app-shell">
      <section class="control-band" aria-label="Zarr slice controls">
        <div class="brand-block">
          <p class="eyebrow">WebGPU Zarr Grid</p>
          <h1>Synced TCZYX canvases</h1>
        </div>

        <div class="controls">
          <fieldset class="dataset-switch" aria-label="Dataset source">
            <legend>Dataset</legend>
            <label>
              <input type="radio" name="dataset-mode" value="sources" />
              <span>Zarr sources</span>
            </label>
            <label>
              <input type="radio" name="dataset-mode" value="figure" checked />
              <span>Figure layout</span>
            </label>
          </fieldset>

          <div class="axis-controls" aria-label="Global slice controls">
            <label class="range-control" for="time-slider">
              <span>Time</span>
              <output id="time-value" for="time-slider">T0 / T0</output>
              <input id="time-slider" type="range" min="0" max="0" value="0" step="1" disabled />
            </label>

            <label class="range-control" for="z-slider">
              <span>Z</span>
              <output id="z-value" for="z-slider">Z0 / Z0</output>
              <input id="z-slider" type="range" min="0" max="0" value="0" step="1" disabled />
            </label>

            <label class="range-control" for="resolution-slider">
              <span>Resolution</span>
              <output id="resolution-value" for="resolution-slider">512 px</output>
              <input id="resolution-slider" type="range" min="128" max="2048" value="512" step="64" />
            </label>
          </div>

          <div id="channel-controls" class="channel-controls" aria-label="Global channel controls"></div>

          <button id="load-button" class="primary-button" type="button">
            <span class="button-mark" aria-hidden="true"></span>
            Load
          </button>
        </div>
      </section>

      <section class="status-strip" aria-live="polite">
        <span id="status-text">Waiting for WebGPU.</span>
        <span id="render-stats">0 visible</span>
      </section>

      <section id="canvas-grid" class="canvas-grid" aria-label="Loaded image slices"></section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
